version: "3"

services:
  scrapyd:
    build: .
    entrypoint: "scrapyd --pidfile= "
    hostname: "scrapyd"
    restart: unless-stopped
    volumes:
      - /www/prd_spider/logs:/app/logs
      - /www/prd_spider/dbs:/app/dbs
      - /www/prd_spider/eggs:/app/eggs
      - /www/prd_spider/ms-playwright:/ms-playwright
    env_file:
      - .env
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
  scrapydweb:
    build: .
    entrypoint: "scrapydweb"
    hostname: "scrapydweb"
    restart: unless-stopped
    environment:
      - HOST_SCRAPYD=scrapyd
      - PORT_SCRAPYD=6800
      - DATA_PATH=/app/data
      - SCRAPY_PROJECTS_DIR=/app/data/projects
    volumes:
      - /www/prd_spider/data/projects:/app/data/projects
      - /www/prd_spider/logs:/app/logs
      - /www/prd_spider/data:/app/data
    ports:
      - "6799:5000"
    env_file:
      - .env
    depends_on:
      - "scrapyd"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
  logparser:
    build: .
    entrypoint: "logparser -dir=/app/logs/"
    hostname: "logparser"
    restart: unless-stopped
    volumes:
      - /www/prd_spider/logs:/app/logs
    env_file:
      - .env
  redis:
    image: bitnami/redis:latest
    hostname: redis
    env_file:
      - .env
    ports:
      - "6389:6379"
    volumes:
      - /www/redis/conf/overrides.d/:/opt/bitnami/redis/mounted-etc/
      - /www/prd_spider/redis_data:/bitnami/redis/data
    restart: unless-stopped

  api_service:
    build: .
    entrypoint: "uvicorn api_service.main:app --host 0.0.0.0 --port 8000"
    hostname: "api_service"
    restart: unless-stopped
    ports:
      - "6798:8000"
    environment:
      - SCRAPYD_URLS=http://scrapyd:6800
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - "scrapyd"
      - "redis"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
